<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda & Repuestos | ALLMOTOSYNC</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="tienda.css">
</head>
<body>

    <header class="tienda-header">
        <a href="../index.html">
            <img src="../MEDIA/IMG_1384%20(1).png" alt="ALLMOTOSYNC Logo">
        </a>
        <h1>TIENDA & CATÁLOGO ESPECIALIZADO</h1>
        <p>Inyección Electrónica, Diagnóstico y Repuestos de Alto Rendimiento</p>
        <a href="../index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver a la página principal</a>
    </header>

    <main class="tienda-container">
        
        <!-- Filtros y Buscador -->
        <div class="tienda-filtros">
            <div class="buscador-wrapper">
                <input type="text" id="buscador" placeholder="Buscar repuesto, sensor, inyector, herramienta...">
            </div>
            <div class="categorias-tabs">
                <button class="filtro-btn activo" data-cat="todos">Todos</button>
                <button class="filtro-btn" data-cat="inyeccion">Inyección FI</button>
                <button class="filtro-btn" data-cat="diagnostico">Diagnóstico & Herramientas</button>
                <button class="filtro-btn" data-cat="electronica">Sensores & Módulos</button>
                <button class="filtro-btn" data-cat="accesorios">Accesorios</button>
            </div>
        </div>

        <!-- Contenedor dinámico de tarjetas -->
        <section id="catalogo-productos" class="catalogo-grid"></section>

    </main>

    <script src="productos.js"></script>
</body>
</html>
