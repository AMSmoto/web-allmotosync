<style>
    /* Estilo inicial del header de la tienda */
    .tienda-header { 
        position: fixed; top: 0; width: 100%; z-index: 1000; 
        background: #000; /* o el color que uses */
        padding: 20px 0; transition: all 0.3s ease; 
        text-align: center;
    }
    #header-logo { transition: all 0.3s ease; max-height: 80px; }
    
    /* Clase que se agregará al hacer scroll */
    .header-chico { padding: 5px 0 !important; }
    .header-chico #header-logo { max-height: 40px !important; }
</style>

<script>
    window.addEventListener("scroll", function() {
        const header = document.getElementById("main-header");
        if (window.scrollY > 50) {
            header.classList.add("header-chico");
        } else {
            header.classList.remove("header-chico");
        }
    });
</script>
