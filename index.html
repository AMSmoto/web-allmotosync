<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA | ALLMOTOSYNC</title>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: sans-serif; margin: 0; }
        
        /* HEADER IGUAL AL PRINCIPAL */
        .header-principal { background: #000; padding: 10px 0; text-align: center; border-bottom: 2px solid #FF6600; position: sticky; top: 0; z-index: 1000; transition: all 0.3s; }
        .header-circuitos-container { display: flex; justify-content: center; align-items: center; gap: 10px; }
        .circuito-lado { width: 250px; height: 50px; }
        .pista-base { fill: none; stroke-width: 2; opacity: 0.3; }
        .impulso-electrico { fill: none; stroke-width: 3; stroke-dasharray: 40 260; animation: correrPulso 3s linear infinite; }
        @keyframes correrPulso { 0% { stroke-dashoffset: 300; } 100% { stroke-dashoffset: 0; } }
        
        /* Ajuste del logo para que encoja */
        #logo-ams { max-height: 80px; transition: all 0.3s; }
        .header-chico { padding: 5px 0; }
        .header-chico #logo-ams { max-height: 40px; }

        .grid-productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        .card-producto { background: #1a1a1a; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #333; }
    </style>
</head>
<body>

    <!-- HEADER IDÉNTICO AL PRINCIPAL -->
    <header id="main-header" class="header-principal">
        <div class="header-circuitos-container">
            <div class="circuito-lado">
                <svg viewBox="0 0 350 70" preserveAspectRatio="none">
                    <path d="M 0,35 L 350,35" class="pista-base" stroke="#00b4d8" />
                    <path d="M 0,35 L 350,35" class="impulso-electrico" stroke="#ff9f1c" />
                </svg>
            </div>
            
            <a href="../index.html"><img src="../MEDIA/ALLMOTOSYNC LOGO.jpg" id="logo-ams" alt="ALLMOTOSYNC"></a>

            <div class="circuito-lado">
                <svg viewBox="0 0 350 70" preserveAspectRatio="none">
                    <path d="M 0,35 L 350,35" class="pista-base" stroke="#ff9f1c" />
                    <path d="M 0,35 L 350,35" class="impulso-electrico" stroke="#00b4d8" />
                </svg>
            </div>
        </div>
    </header>

    <main>
        <h1 style="text-align: center; color: #FF6600; margin-top: 40px;">CATÁLOGO DE REPUESTOS</h1>
        <div id="contenedor-productos" class="grid-productos"></div>
    </main>

    <script>
        // Efecto scroll para encoger header y logo
        window.addEventListener("scroll", () => {
            const h = document.getElementById("main-header");
            h.classList.toggle("header-chico", window.scrollY > 50);
        });

        // Carga de productos
        const productos = [
            { nombre: "Escáner OBD", precio: "$250.000" },
            { nombre: "Kit Arrastre KTM", precio: "$180.000" },
            { nombre: "Inyector Alto Flujo", precio: "$95.000" }
        ];
        const contenedor = document.getElementById('contenedor-productos');
        productos.forEach(p => {
            contenedor.innerHTML += `
                <div class="card-producto">
                    <h3>${p.nombre}</h3>
                    <p style="color: #FF6600; font-weight: bold;">${p.precio}</p>
                    <button style="background:#FF6600; border:none; padding:10px; border-radius:5px; cursor:pointer;">Comprar</button>
                </div>
            `;
        });
    </script>
</body>
</html>
